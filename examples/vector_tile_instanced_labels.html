<html>
    <head>
        <title>Itowns - Globe + instanced labels</title>

        <script type="importmap">
        {
            "imports": {
                "itowns": "../dist/itowns.js",
                "debug": "../dist/debug.js",
                "dat": "https://unpkg.com/dat.gui@0.7.9/build/dat.gui.module.js",
                "GuiTools": "./jsm/GUI/GuiTools.js",
                "LoadingScreen": "./jsm/GUI/LoadingScreen.js",
                "three": "https://unpkg.com/three@0.182.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.182.0/examples/jsm/"
            }
        }
        </script>

        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="css/example.css">
        <link rel="stylesheet" type="text/css" href="css/noto.css">
        <link rel="stylesheet" type="text/css" href="css/LoadingScreen.css">
        <!-- Font of the PLAN.IGN style -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,600;0,700;1,400&display=block">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div id="viewerDiv"></div>
        <div id="description">
            <p>Labels of the vector tile layer are drawn as instanced SDF text
            (<b>@itowns/labels</b>) instead of DOM elements.</p>
            <p>Switch <b>Label renderer</b> in the menu to compare them with DOM
            labels.</p>
        </div>
        <script type="module">

            import GuiTools from 'GuiTools';
            import setupLoadingScreen from 'LoadingScreen';
            import * as THREE from 'three';
            import * as itowns from 'itowns';
            // # Globe viewer with GPU instanced labels
            //
            // `addLabelLayer.instanced` draws the labels of the vector tile layer
            // as SDF text, in one instanced draw call. They are not culled behind
            // the horizon and not depth tested against the terrain.

            // Label glyphs are rasterized once, so every font face the style
            // uses is loaded before the labels are made.
            await Promise.all(['400', 'italic 400', '600', '700']
                .map(face => document.fonts.load(`${face} 16px "Source Sans Pro"`, 'Aœ')));

            // Define initial camera position
            const placement = {
                coord: new itowns.Coordinates('EPSG:4326', 2.3488, 48.8534),
                range: 8000,
                tilt: 45,
            };

            // `viewerDiv` will contain iTowns' rendering area (`<canvas>`)
            const viewerDiv = document.getElementById('viewerDiv');

            // Instanciate iTowns GlobeView
            const view = new itowns.GlobeView(viewerDiv, placement);

            // define pole texture
            view.tileLayer.noTextureColor = new THREE.Color(0x95c1e1);

            setupLoadingScreen(viewerDiv, view);

            itowns.Fetcher.json('./layers/JSONLayers/IGN_MNT_HIGHRES.json').then((config) => {
                config.source = new itowns.WMTSSource(config.source);
                return view.addLayer(new itowns.ElevationLayer(config.id, config));
            }).catch(console.error);

            // Define a VectorTilesSource to load Vector Tiles data from the geoportail
            const mvtSource = new itowns.VectorTilesSource({
                style: 'https://data.geopf.fr/annexes/ressources/vectorTiles/styles/PLAN.IGN/standard.json',
                // We don't display mountains related data to ease visualisation
                filter: layer => !layer['source-layer'].includes('oro_')
                    && !layer['source-layer'].includes('parcellaire'),
            });

            const mvtLayer = new itowns.ColorLayer('MVT', {
                source: mvtSource,
                addLabelLayer: { performance: true, instanced: true },
            });

            const vectorTiles = view.addLayer(mvtLayer);

            // The same labels drawn as DOM elements, to compare both renderers.
            // One of the two label layers is visible at a time; a hidden label
            // layer stops updating, so switching changes nothing else.
            function addDomLabelLayer() {
                const domLabelLayer = new itowns.LabelLayer('MVT-label-dom', {
                    source: mvtSource,
                    style: mvtLayer.style,
                    zoom: mvtLayer.zoom,
                    performance: true,
                    margin: 15,
                    // Placed on the terrain, as the instanced labels are.
                    forceClampToTerrain: true,
                    visible: false,
                });
                return view.addLayer(domLabelLayer);
            }

            // Shows the label layer of the selected renderer, when labels are on
            // and the vector tile layer is visible.
            function addLabelGUI(gui, domLabelLayer) {
                const instancedLabelLayer = view.getLayerById('MVT-label');
                const settings = { labels: true, renderer: 'instanced' };
                const update = () => {
                    const on = settings.labels && mvtLayer.visible;
                    instancedLabelLayer.visible = on && settings.renderer === 'instanced';
                    domLabelLayer.visible = on && settings.renderer === 'dom';
                    view.notifyChange(view.camera3D);
                };
                // Runs after the view's own listener, which shows the instanced
                // labels with the vector tile layer.
                mvtLayer.addEventListener('visible-property-changed', update);
                gui.add(settings, 'labels').name('Labels').onChange(update);
                gui.add(settings, 'renderer', { Instanced: 'instanced', DOM: 'dom' })
                    .name('Label renderer').onChange(update);
            }

            const menuGlobe = new GuiTools('menuDiv', view, 300);

            // Menus, once the vector tile layer is ready.
            vectorTiles.then(() => {
                menuGlobe.addImageryLayersGUI(view.getLayers(l => l.isColorLayer));
                return addDomLabelLayer();
            }).then((domLabelLayer) => {
                addLabelGUI(menuGlobe.gui, domLabelLayer);
            }).catch(console.error);

            window.view = view;
            window.itowns = itowns;
            window.THREE = THREE;

        </script>
    </body>
</html>
