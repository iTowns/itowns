<html>
    <head>
        <title>Itowns - OGC Client layer browser</title>

        <script type="importmap">
        {
            "imports": {
                "itowns": "../dist/itowns.js",
                "debug": "../dist/debug.js",
                "three": "https://unpkg.com/three@0.182.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.182.0/examples/jsm/",
                "@camptocamp/ogc-client": "https://esm.sh/@camptocamp/ogc-client@1.3.1-dev.a3dd915?standalone"
            }
        }
        </script>

        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/css" href="css/example.css">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            #toolbox {
                position: absolute;
                top: 10px;
                left: 10px;
                z-index: 2;
                width: 24em;
                max-height: calc(100vh - 20px);
                overflow: auto;
                color-scheme: dark;
                background: rgba(0, 0, 0, 0.7);
            }

            #toolbox ul,
            #toolbox ol {
                margin: 0;
                padding: 0;
            }

            #toolbox li {
                display: flex;
                align-items: center;
                gap: 0.25em;
                overflow-wrap: anywhere;
            }

            #toolbox [hidden] {
                display: none;
            }

            #layer-list {
                max-height: 40vh;
                overflow: auto;
            }

            #layer-list label {
                display: flex;
                align-items: flex-start;
                gap: 0.25em;
            }

            #layer-list label > span {
                display: flex;
                flex-direction: column;
            }

            #toolbox input[type="range"] {
                width: 5em;
            }
        </style>
    </head>
    <body>
        <div id="viewerDiv"></div>

        <form id="toolbox">
            <fieldset>
                <legend>Connect to an OGC service</legend>
                <input type="url" id="ogc-url" required placeholder="Service URL" value="https://data.geopf.fr/wmts">
                <select id="ogc-type">
                    <option value="wmts">WMTS</option>
                    <option value="wms">WMS</option>
                    <option value="wfs">WFS</option>
                </select>
                <button>Connect</button>
                <output id="ogc-status"></output>
            </fieldset>

            <fieldset id="layer-picker" hidden>
                <legend><output id="layer-count"></output> layers available</legend>
                <input type="search" id="layer-search" placeholder="Search...">
                <ul id="layer-list"></ul>
                <button type="button" id="layer-add">Add selected</button>
            </fieldset>

            <fieldset id="active" hidden>
                <legend><output id="active-count"></output> active layers</legend>
                <ol id="active-list"></ol>
            </fieldset>
        </form>

        <script type="module" src="source_ogc_client.js"></script>
    </body>
</html>
